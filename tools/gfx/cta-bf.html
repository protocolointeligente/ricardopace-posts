<script>
const T=window.A0;const tl=gsap.timeline({paused:true});
tl.from('#sh',{y:60,opacity:0,duration:.35,ease:'power4.out'},0.15)
 .from('#box',{y:80,opacity:0,duration:.4,ease:'power4.out'},T)

 .to({},{duration:0.01},window.DUR);window.tl=tl;
