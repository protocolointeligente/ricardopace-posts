<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!-- Capa de Reel (sem foto do Ricardo). Parâmetros em capa.json, render: python3 capa.py <pasta-do-post> -->
<style>
#bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.1) contrast(1.05)}
#sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.92) 0%,rgba(11,11,12,.55) 30%,rgba(11,11,12,.55) 55%,rgba(11,11,12,.95) 82%),radial-gradient(circle at 50% 50%,rgba(255,106,0,.18),transparent 60%)}
#hd{position:absolute;top:300px;left:0;right:0;text-align:center;font-size:26px;letter-spacing:.24em}
#hd b{font-family:A;font-weight:400;font-size:38px;letter-spacing:.04em;margin-right:14px}
#hd i{font-style:normal;color:#FF6A00;margin-right:14px}
#w{position:absolute;top:470px;left:60px;right:60px;text-align:center}
.tag{font-size:40px;margin-bottom:34px}
.l{font-family:A;text-transform:uppercase;line-height:1.04;text-shadow:0 8px 40px rgba(0,0,0,.6)}
#l1,#l3{font-size:var(--s1,190px)}
#l2{font-size:var(--s2,290px);color:#FF6A00;margin:14px 0 -6px}
#fx{display:inline-block;margin-top:46px;border:8px solid #FF6A00;background:#0B0B0C;padding:16px 34px;font-family:A;font-size:66px;text-transform:uppercase;letter-spacing:.02em}
#at{position:absolute;top:1590px;left:0;right:0;text-align:center;font-size:34px;color:#F7F7F5;opacity:.9}
</style></head><body><div class="bg"></div><div id="bg"></div><div id="sh"></div><div class="grid" style="opacity:.6"></div>
<div id="hd"><b>RICARDO PACE</b><i>|</i>CIÊNCIA E TREINAMENTO</div>
<div id="w"><span class="tag" id="tag"></span><div class="l" id="l1"></div><div class="l" id="l2"></div><div class="l" id="l3"></div><div id="fx"></div></div>
<div id="at">@personal.ricardopace</div>
<script>
const c=JSON.parse(decodeURIComponent(location.hash.slice(1)));
if(c.bg)document.getElementById('bg').style.backgroundImage=`url('${c.bg}')`;
for(const k of ['tag','l1','l2','l3','fx']){const e=document.getElementById(k);if(c[k])e.textContent=c[k];else e.style.display='none'}
if(c.s1)document.documentElement.style.setProperty('--s1',c.s1+'px');
if(c.s2)document.documentElement.style.setProperty('--s2',c.s2+'px');
</script></body></html>
