<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="gsap.min.js"></script>
<style>
#t{position:absolute;top:330px;left:90px;right:90px}

</style></head><body><div class="bg"></div><div class="grid"></div>
<div id="t"><span class="tag">PRÓXIMO TREINO DE PERNA</span><div class="h">Salva <span class="o">isso</span></div></div>
<div id="list">

</div>

<script>
const D=window.DUR, A=window.A0;
const tl=gsap.timeline({paused:true});
tl.from('#t',{y:-60,opacity:0,duration:.45},A)
  .from('#i1',{x:-120,opacity:0,duration:.42,ease:'back.out(1.6)'},A+3.0)
  .from('#i2',{x:-120,opacity:0,duration:.42,ease:'back.out(1.6)'},A+5.0)
  .from('#i3',{x:-120,opacity:0,duration:.42,ease:'back.out(1.6)'},A+6.7)
  .from('#warn',{opacity:0,y:30,duration:.35},A+8.0)
  .to({},{duration:0.01},D);
window.tl=tl;
</script></body></html>
